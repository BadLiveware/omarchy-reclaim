[package]
name = "reclaim"
version = "0.1.0"
edition = "2024"
description = "Reclaim disk space from stale build outputs, git worktrees and Docker"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
